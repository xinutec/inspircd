# conf/tls is the `irc-tls` secret, mounted by the Deployment. isis's ACME unit
# writes each renewal into it (nixos-config machines/isis/frontdoor.nix) and the
# kubelet refreshes the mount in place.
#
# ⚠ This repository deploys itself: the pod pulls it every five minutes and
# rehashes, so a wrong path breaks TLS within five minutes, and a revert heals it
# as fast.
<sslprofile name="default"
            provider="gnutls"
            certfile="conf/tls/tls.crt"
            keyfile="conf/tls/tls.key"
            dhfile="dhparams.pem"
            hash="sha1">

<gnutls onrehash="yes">
