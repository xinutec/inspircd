# conf/tls is the `irc-tls` secret, mounted by the Deployment. isis's ACME unit
# writes each renewal into it (nixos-config machines/isis/frontdoor.nix) and the
# kubelet refreshes the mount in place. It used to be conf/secret, a
# PVC directory somebody topped up by hand; the rest of conf/secret
# (server.conf, links.conf, cloak.conf, modules.conf) is unchanged — only the
# certificate moved.
#
# ⚠ THIS REPOSITORY AUTO-DEPLOYS. The running pod pulls it every five minutes
# and rehashes on any change, so a wrong path here breaks TLS unattended within
# five minutes — and heals just as fast if you revert.
<sslprofile name="default"
            provider="gnutls"
            certfile="conf/tls/tls.crt"
            keyfile="conf/tls/tls.key"
            dhfile="dhparams.pem"
            hash="sha1">

<gnutls onrehash="yes">
