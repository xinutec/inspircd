# conf/tls is the `irc-tls` secret cert-manager renews, mounted by the
# Deployment. conf/secret was a directory on the PVC that a human filled in with
# `kubectl cp` every ~60 days — and when nobody did, this server went on serving
# an expiring certificate while a good one sat in the secret, because inspircd
# reads its certificate at rehash and never again. Restarting did not help
# either: the PVC still held the old file.
#
# Now the file under conf/tls is refreshed in place by the kubelet on renewal,
# and init.sh's five-minute poll stamps it alongside this repo's HEAD, so the
# same loop that picks up a config change picks up a certificate change and
# rehashes. The other files in conf/secret (server.conf, links.conf, cloak.conf,
# modules.conf) stay where they are; only the certificate moved.
<sslprofile name="default"
            provider="gnutls"
            certfile="conf/tls/tls.crt"
            keyfile="conf/tls/tls.key"
            dhfile="dhparams.pem"
            hash="sha1">

<gnutls onrehash="yes">
